# =============================================================================
# AEMET Dataset: Signature Kernel Hyperparameter Sweep
# 
# Dataset characteristics:
# - 73 Spanish weather stations (small dataset, repeated 50x for training)
# - 365 time points (daily temperatures, full year)
# - Strong seasonal pattern (summer peak ~day 200)
# - Smooth temporal structure (temperatures don't jump drastically)
# - Key metrics: seasonal_mse, autocorrelation_mse, mean_mse
#
# Signature kernel considerations for AEMET:
# - 365 points is moderately long → max_seq_len=128 captures key patterns
# - Seasonal patterns suggest time_aug is important
# - dyadic_order limited to 0-2 for computational efficiency
# - Lead-lag may help with autocorrelation but less critical than rough data
# - Static kernel sigma affects local vs global sensitivity
# =============================================================================

# =============================================================================
# SECTION 1: BEST KNOWN NON-SIGNATURE BASELINES
# =============================================================================

independent:
  use_ot: false

gaussian_ot:
  use_ot: true
  ot_method: gaussian
  ot_reg: 0.1  # Higher reg for 365-dim stability
  ot_coupling: barycentric

euclidean_exact:
  use_ot: true
  ot_method: exact
  ot_kernel: euclidean
  ot_coupling: sample

euclidean_sinkhorn_reg0.1:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: euclidean
  ot_coupling: sample

rbf_sinkhorn_reg0.1:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 5.0

# =============================================================================
# SECTION 2: SIGNATURE KERNEL - BASELINE & MAX_SEQ_LEN SWEEP
# =============================================================================

# Baseline signature config (current AEMET default)
sig_baseline:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: signature
  ot_coupling: sample
  ot_kernel_params:
    time_aug: true
    lead_lag: false
    dyadic_order: 1
    static_kernel_type: rbf
    static_kernel_sigma: 1.0
    add_basepoint: true
    normalize: true
    max_seq_len: 64
    max_batch: 32

# Higher resolution (captures more of 365 points)
sig_maxlen128:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
