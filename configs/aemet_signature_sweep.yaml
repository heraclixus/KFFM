# =============================================================================
# SUMMARY & RECOMMENDATIONS FOR AEMET
# =============================================================================
#
# Expected best performers for AEMET (seasonal temperature data):
#
# 1. For autocorrelation_mse: sig_leadlag_order1 or sig_leadlag_order2
#    - Lead-lag captures lagged temporal dependencies
#
# 2. For seasonal_mse: sig_order2_sigma5.0 or sig_leadlag_order2_sigma5.0
#    - Order 2 + larger sigma captures smooth seasonal patterns
#
# 3. For mean_mse: sig_order1 or sig_order2 with sigma 1.0-2.0
#    - Balanced configuration for overall quality
#
# Key hyperparameters to tune:
# - dyadic_order: 0-2 (limited range for computational efficiency)
# - lead_lag: true for autocorrelation
# - static_kernel_sigma: 2.0-5.0 for smooth seasonal data
# - max_seq_len: 128-256 to capture yearly patterns
#
# Memory considerations:
# - AEMET has 365 time points (moderately long)
# - Use batch_size_signature=64 and max_batch=16 or lower
# =============================================================================
