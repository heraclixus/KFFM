# =============================================================================
# Long Time Series Sweep Config (heston-long)
# 
# For sequences with 1000 time steps (vs standard 100 steps)
#
# Key considerations for long sequences:
# - Signature kernel max_seq_len must accommodate longer paths (or subsample)
# - dyadic_order limited to 0-2 for computational efficiency
# - Lead-lag augmentation captures lagged dependencies across longer horizons
# - Memory constraints require smaller max_batch for signature kernel
# - RBF/Euclidean kernels scale better but miss sequential structure
#
# Best known configs from standard datasets are included as baselines.
# Focus is on signature kernel tuning for long sequences.
# =============================================================================

# =============================================================================
# SECTION 1: BEST KNOWN BASELINES (non-signature kernels)
# =============================================================================

# -----------------------------------------------------------------------------
# Independent (no OT) - baseline
# -----------------------------------------------------------------------------
independent:
  use_ot: false

# -----------------------------------------------------------------------------
# Gaussian OT
# Closed-form, fast, scales well to long sequences
# -----------------------------------------------------------------------------
gaussian_ot:
  use_ot: true
  ot_method: gaussian
  ot_reg: 0.001
  ot_coupling: barycentric

gaussian_ot_reg1e-4:
  use_ot: true
  ot_method: gaussian
  ot_reg: 0.0001
  ot_coupling: barycentric

# -----------------------------------------------------------------------------
# Euclidean OT - Good general performance
# -----------------------------------------------------------------------------
euclidean_exact:
  use_ot: true
  ot_method: exact
  ot_kernel: euclidean
  ot_coupling: sample

euclidean_sinkhorn_reg0.1:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: euclidean
  ot_coupling: sample

euclidean_sinkhorn_reg0.5:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.5
  ot_kernel: euclidean
  ot_coupling: sample

# -----------------------------------------------------------------------------
# RBF OT - Best spectrum metrics on standard datasets
# -----------------------------------------------------------------------------
rbf_exact_sigma5.0:
  use_ot: true
  ot_method: exact
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 5.0

rbf_sinkhorn_reg0.1_sigma5.0:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 5.0

# Smaller sigma for longer sequences (more local)
rbf_sinkhorn_reg0.1_sigma1.0:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 1.0

rbf_sinkhorn_reg0.1_sigma0.5:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 0.5

# =============================================================================
# SECTION 2: SIGNATURE KERNEL TUNING FOR LONG SEQUENCES
# =============================================================================

# -----------------------------------------------------------------------------
# 2.1 Baseline signature configs (adapted for long sequences)
# max_seq_len=128 to handle longer sequences (will subsample if needed)
# max_batch reduced for memory efficiency
# -----------------------------------------------------------------------------
sig_baseline_long:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: signature
  ot_coupling: sample
  ot_kernel_params:
    time_aug: true
    lead_lag: false
    dyadic_order: 1
    static_kernel_type: rbf
    static_kernel_sigma: 1.0
    add_basepoint: true
    normalize: true
    max_seq_len: 128  # Increased for long sequences
    max_batch: 16     # Reduced for memory

# Higher max_seq_len variants
sig_maxlen256:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: signature
  ot_coupling: sample
  ot_kernel_params:
    time_aug: true
    lead_lag: false
    dyadic_order: 1
    static_kernel_type: rbf
    static_kernel_sigma: 1.0
    add_basepoint: true
    normalize: true
    max_seq_len: 256  # Higher resolution
    max_batch: 8      # Smaller batch for memory

sig_maxlen512:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: signature
  ot_coupling: sample
  ot_kernel_params:
    time_aug: true
    lead_lag: false
    dyadic_order: 1
    static_kernel_type: rbf
    static_kernel_sigma: 1.0
    add_basepoint: true
    normalize: true
    max_seq_len: 512  # Very high resolution
    max_batch: 4      # Minimal batch for memory

# -----------------------------------------------------------------------------
# 2.2 Dyadic Order Sweep
# Orders 0-2 for computational efficiency
# Order 0 = simplest, Order 2 = captures more hierarchical structure
# -----------------------------------------------------------------------------
sig_order0_long:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: signature
  ot_coupling: sample
  ot_kernel_params:
    time_aug: true
    lead_lag: false
    dyadic_order: 0
    static_kernel_type: rbf
    static_kernel_sigma: 1.0
    add_basepoint: true
    normalize: true
    max_seq_len: 128
    max_batch: 16

sig_order1_long:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: signature
  ot_coupling: sample
  ot_kernel_params:
    time_aug: true
    lead_lag: false
    dyadic_order: 1
    static_kernel_type: rbf
    static_kernel_sigma: 1.0
    add_basepoint: true
    normalize: true
    max_seq_len: 128
    max_batch: 16

sig_order2_long:
