# Navier-Stokes Expanded Sweep: Focus on Spectrum Distribution
# 
# Current Best Results (by avg_wasserstein - lower = better spectrum distribution):
# - DDPM: 0.66 (baseline to beat)
# - gp_kl0.05_reg0.5: 1.03 (best k-FFM)
# - euclidean_sinkhorn_reg0.5: 1.10
# - rbf_sinkhorn_reg0.5: 1.11
#
# Key Findings from Previous Sweep:
# 1. GP kernel_length=0.05 gives best spectral properties
# 2. Regularization around 0.5 is optimal
# 3. Lower reg (0.1) also competitive
# 4. Euclidean slightly better than RBF for spectrum
#
# This sweep explores:
# - Finer GP kernel length grid (0.03-0.1)
# - Regularization refinement (0.4-0.8)
# - RBF sigma expansion (1.0-100.0)
# - Combined best settings
# - Higher Sinkhorn iterations for convergence

# =============================================================================
# SECTION 1: GP KERNEL LENGTH SWEEP (most promising direction)
# Best so far: kernel_length=0.05
# =============================================================================

# Fine-grained around 0.05
gp_kl0.03_euc:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.5
  ot_kernel: euclidean
  ot_coupling: sample
  gp_kernel_length: 0.03
  gp_kernel_variance: 1.0

