# =============================================================================
# Phase 3: Focused Improvement Sweep for Underperforming Datasets
#
# Datasets requiring improvement (focusing on most promising kernels):
# 1. KdV: spectrum_mse_log (35% behind DDPM) - Euclidean/RBF focus  
# 2. Stochastic KdV: spectrum_mse_log (10x behind DDPM) - RBF focus
#
# Datasets already winning (skip):
# - Navier-Stokes: k-FFM already 21% better than DDPM
# - Stochastic NS: k-FFM already 33x better than DDPM
# =============================================================================

# #############################################################################
# SECTION 1: KdV - EUCLIDEAN/RBF FOCUS on SPECTRUM_MSE_LOG
# Target: Beat DDPM (10.46) - Current best k-FFM: 15.97
#
# Key insight: spectrum_mse_log weights all frequencies equally.
# DDPM's diffusion process naturally captures spectral decay.
# Need to tune GP prior to match data's spectral characteristics.
#
# Most promising from Phase 1-2: GP prior + FNO modes
# #############################################################################

# Strategy 1a: Very smooth GP priors (match physical solution smoothness)
kdv_gp_kl0.2_reg0.1:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: euclidean
  ot_coupling: sample
  gp_kernel_length: 0.2  # Very smooth
  gp_kernel_variance: 0.1

kdv_gp_kl0.5_reg0.1:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: euclidean
  ot_coupling: sample
  gp_kernel_length: 0.5
  gp_kernel_variance: 0.1

kdv_gp_kl1.0_reg0.1:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: euclidean
  ot_coupling: sample
  gp_kernel_length: 1.0
  gp_kernel_variance: 0.1

# Strategy 1b: Higher FNO modes for better spectral resolution
kdv_fno_modes256_reg0.1:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: euclidean
  ot_coupling: sample
  gp_kernel_length: 0.01
  gp_kernel_variance: 0.1
  fno_modes: 256

kdv_fno_modes192_gp0.05:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: euclidean
  ot_coupling: sample
  gp_kernel_length: 0.05
  gp_kernel_variance: 0.1
  fno_modes: 192

# Strategy 1c: RBF with very large sigma (smooth coupling)
kdv_rbf_sigma100_reg0.1:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 100.0  # Very smooth coupling
  gp_kernel_length: 0.01
  gp_kernel_variance: 0.1

kdv_rbf_sigma200_reg0.1:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 200.0
  gp_kernel_length: 0.01
  gp_kernel_variance: 0.1

# Strategy 1d: Combined smooth GP + high modes + very low reg
kdv_combo_smooth:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.01
  ot_kernel: euclidean
  ot_coupling: sample
  gp_kernel_length: 0.2
  gp_kernel_variance: 0.1
  fno_modes: 128

kdv_combo_verysmooth:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.02
  ot_kernel: euclidean
  ot_coupling: sample
  gp_kernel_length: 0.5
  gp_kernel_variance: 0.1
  fno_modes: 96

# Strategy 1e: Exact OT (no regularization artifact on spectrum)
kdv_euclidean_exact_gp0.1:
  use_ot: true
  ot_method: exact
  ot_kernel: euclidean
  ot_coupling: sample
  gp_kernel_length: 0.1
  gp_kernel_variance: 0.1

kdv_rbf_exact_sigma50:
  use_ot: true
  ot_method: exact
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 50.0
  gp_kernel_length: 0.1
  gp_kernel_variance: 0.1


# #############################################################################
# SECTION 2: Stochastic KdV - RBF FOCUS on SPECTRUM_MSE_LOG  
# Target: Beat DDPM (0.317) - Current best k-FFM: 3.37 (10x gap)
#
# Key insight: k-FFM wins on mean_mse and spectrum_mse, loses on log-spectrum
# Log-spectrum emphasizes high-frequency accuracy. 
# Need to capture spectral decay without over-regularizing.
# #############################################################################

# Strategy 2a: Exact OT with optimal sigma (removes reg artifacts)
stoch_kdv_rbf_exact_sigma0.1:
  use_ot: true
  ot_method: exact
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 0.1  # Very local for fine spectral structure

stoch_kdv_rbf_exact_sigma0.3:
  use_ot: true
  ot_method: exact
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 0.3

stoch_kdv_euclidean_exact:
  use_ot: true
  ot_method: exact
  ot_kernel: euclidean
  ot_coupling: sample

# Strategy 2b: GP prior tuning for spectral decay
stoch_kdv_gp_kl0.05_rbf:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.05
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 1.0
  gp_kernel_length: 0.05
  gp_kernel_variance: 0.1

stoch_kdv_gp_kl0.1_rbf:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.05
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 1.0
  gp_kernel_length: 0.1
  gp_kernel_variance: 0.1

stoch_kdv_gp_kl0.2_euclidean:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.05
  ot_kernel: euclidean
  ot_coupling: sample
  gp_kernel_length: 0.2
  gp_kernel_variance: 0.1

# Strategy 2c: Ultra-low Sinkhorn regularization
stoch_kdv_euclidean_reg0.001:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.001
  ot_kernel: euclidean
  ot_coupling: sample

stoch_kdv_rbf_sigma0.5_reg0.001:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.001
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 0.5

# Strategy 2d: RBF with larger sigma (smooth spectral coupling)
stoch_kdv_rbf_sigma50_reg0.05:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.05
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 50.0

stoch_kdv_rbf_sigma100_reg0.05:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.05
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 100.0

# Strategy 2e: Signature kernel (path-based for spectral patterns)
stoch_kdv_sig_order3_reg0.05:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.05
  ot_kernel: signature
  ot_coupling: sample
  ot_kernel_params:
    time_aug: true
    lead_lag: false
    dyadic_order: 3
    static_kernel_type: rbf
    static_kernel_sigma: 1.0
    add_basepoint: true
    normalize: true
    max_seq_len: 64
    max_batch: 32

stoch_kdv_sig_exact_order2:
  use_ot: true
  ot_method: exact
  ot_kernel: signature
  ot_coupling: sample
  ot_kernel_params:
    time_aug: true
    lead_lag: false
    dyadic_order: 2
    static_kernel_type: rbf
    static_kernel_sigma: 1.0
    add_basepoint: true
    normalize: true
    max_seq_len: 64
    max_batch: 16


