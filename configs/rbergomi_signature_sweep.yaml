# =============================================================================
# Comprehensive Signature Kernel Sweep for rBergomi dataset (100 steps)
# Goal: Make signature kernel the best performing kernel type
#
# rBergomi-specific considerations:
# - Rough paths with H=0.1 (much rougher than Brownian motion H=0.5)
# - Signature kernels should theoretically excel on rough paths
# - Lead-lag augmentation captures short-range dependencies
# - Lower dyadic order (0-2) works better for very rough paths
# - Smaller static_kernel_sigma captures local roughness
# =============================================================================

# =============================================================================
# SECTION 1: BASELINES (for comparison)
# =============================================================================

# No OT baseline
independent:
  use_ot: false

# Gaussian OT baseline
gaussian_ot:
  use_ot: true
  ot_method: gaussian
  ot_reg: 0.001
  ot_coupling: barycentric

# Euclidean baselines
euclidean_exact:
  use_ot: true
  ot_method: exact
  ot_kernel: euclidean
  ot_coupling: sample

euclidean_sinkhorn:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: euclidean
  ot_coupling: sample

# RBF baselines
rbf_sigma0.5:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 0.5

rbf_sigma1.0:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 1.0

rbf_sigma2.0:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: rbf
  ot_coupling: sample
  ot_kernel_params:
    sigma: 2.0

# =============================================================================
# SECTION 2: SIGNATURE KERNEL - DYADIC ORDER SWEEP
# Order 0-2 for rough paths (lower = captures fine-scale roughness)
# =============================================================================

sig_order0:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: signature
  ot_coupling: sample
  ot_kernel_params:
    time_aug: true
    lead_lag: false
    dyadic_order: 0
    static_kernel_type: rbf
    static_kernel_sigma: 1.0
    add_basepoint: true
    normalize: true
    max_seq_len: 64
    max_batch: 32

sig_order1:
  use_ot: true
  ot_method: sinkhorn
  ot_reg: 0.1
  ot_kernel: signature
  ot_coupling: sample
