# Stochastic Navier-Stokes Expanded Sweep: Focus on Spectrum Distribution
#
# Current Status:
# - DDPM significantly better on spectrum_mse (432 vs ~50,000 for k-FFM)
# - GP kernel length tuning shows promise (gp_kl0.05, gp_kl0.1 explored)
# - Lower regularization (0.01-0.05) seems better for this dataset
#
# This sweep expands exploration of:
# - Finer GP kernel length grid
# - RBF sigma variations
# - Lower regularization values
# - GP + OT combinations
# - FNO modes with best settings

